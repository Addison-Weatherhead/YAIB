program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - "train"
  - "-t"
  - "SimulatedDatasetImputation"
  - "-d"
  - "demo_data/simulated/sinusoids"
  - "-c"
  - "--wandb-sweep"
  - "--wandb"
method: bayes
run_cap: 64 
metric:
  name: avg.mae
  goal: minimize
name: Attention hyperparameter sweep
parameters:
  model:
    values: ["Attention"] # DiffWave not working yet
  ImputationDataset.mask_method:
    values: ["MCAR"]
  seed:
    values: [1111]
  data_dir:
    values: ["demo_data/simulated/sinusoids"]
  execute_repeated_cv.cv_folds:
    values: [5]
  execute_repeated_cv.cv_folds_to_train:
    values: [1]
  execute_repeated_cv.cv_repetitions_to_train:
    values: [1]
  execute_repeated_cv.cv_repetitions:
    values: [2]
  ImputationWrapper.lr_scheduler:
    values: ["cosine", ""]
  Adam.lr:
    values: [0.001, 0.005]
  Attention.n_layers:
    values: [2, 4]
  Attention.d_model:
    values: [64, 128] #[64, 128, 256]
  Attention.d_inner:
    values: [64, 128] #[64, 128, 256]
  Attention.n_head:
    values: [4, 8] #[4, 8, 16]
  Attention.d_k:
    values: [64] #[32, 64, 128]
  Attention.d_v:
    values: [64, 128] #[32, 64, 128]
  Attention.dropout:
    values: [0.1, 0.3] #[0.0, 0.1, 0.3]
